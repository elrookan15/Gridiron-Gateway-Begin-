name: Fedorov & Jules Agent Pipeline

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Step 1: Fedorov converts issues into executable architectural specs
  fedorov-plan:
    if: github.event_name == 'issues' && github.event.label.name == 'agent:fedorov'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Fedorov Spec Planner
        uses: fedorov-ai/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: 'plan'
          target-label: 'agent:jules-execute'

  # Step 2: Jules executes code changes based on Fedorov's specification
  jules-implement:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'agent:jules-execute')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Jules Developer Agent
        uses: google-jules/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: 'implement'
          branch-prefix: 'jules-feat/'

  # Step 3: Jules reviews PR code while Fedorov verifies architectural compliance
  agent-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Pre-Commit Review Gates
        run: npm run test:pre-commit
