name: Fedorov & Jules Agent Pipeline

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Step 1: Fedorov converts issues into executable architectural specs
  fedorov-plan:
    if: github.event_name == 'issues' && github.event.label.name == 'agent:fedorov'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Fedorov Spec Planner
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['agent:jules-execute']
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Fedorov has generated the architectural spec for this issue and handed it off to Jules for implementation.'
            });

  # Step 2: Jules executes code changes based on Fedorov's specification
  jules-implement:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'agent:jules-execute')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Jules Developer Agent
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Jules has picked up this issue for implementation on a `jules-feat/` branch.'
            });

  # Step 3: Jules reviews PR code while Fedorov verifies architectural compliance
  agent-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Jules PR Code Review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Jules has reviewed the code changes in this pull request.'
            });

      - name: Fedorov Architecture Verification
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Fedorov has verified architectural compliance for this pull request.'
            });
