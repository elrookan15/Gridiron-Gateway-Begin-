name: Fedorov & Jules Agent Pipeline

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Step 1: Fedorov converts issues into executable architectural specs
  fedorov-plan:
    if: github.event_name == 'issues' && github.event.label.name == 'agent:fedorov'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Queue Jules Execution Label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.issue.number;
            const labels = (context.payload.issue?.labels ?? []).map((label) => label.name);

            if (!labels.includes('agent:jules-execute')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['agent:jules-execute'],
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: 'Fedorov plan gate passed. `agent:jules-execute` has been queued for implementation.',
            });

  # Step 2: Jules executes code changes based on Fedorov's specification
  jules-implement:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'agent:jules-execute')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Post Jules Implementation Handoff
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Jules implementation gate triggered from `agent:jules-execute` label. Proceed with repository-native implementation workflow.',
            });

  # Step 3: Jules reviews PR code while Fedorov verifies architectural compliance
  agent-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Pre-Commit Review Gates
        run: npm run test:pre-commit
